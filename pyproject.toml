[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-dislocation-lab"
version = "0.1.0"
description = "Phase-0 feasibility tests for post-announcement FX price dislocations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Macro Dislocation Lab contributors"}]
dependencies = []

[project.scripts]
macro-lab = "macro_dislocation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
